
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- MOBILE -->
        <section class="layout mobile">
            <h3>MOBILE</h3>
            <div class="box header">HEADER</div>
            <div class="box menu">MENU</div>
            <div class="box hero">HERO</div>
            <div class="box main">MAIN</div>
            <div class="box banner">BANNER</div>
            <div class="box extra">EXTRA</div>
            <div class="box image">IMAGE</div>
        </section>

        <!-- TABLET -->
        <section class="layout tablet">
            <h3>TABLET</h3>
            <div class="box header">HEADER</div>
            <div class="box hero">HERO</div>

            <div class="tablet-content">
                <div class="box menu">MENU</div>
                <div class="box main">MAIN</div>
                <div class="box banner">BANNER</div>

                <div class="tablet-bottom">
                    <div class="box extra">EXTRA</div>
                    <div class="box image">IMAGE</div>
                </div>
            </div>
        </section>

        <!-- DESKTOP -->
        <section class="layout desktop">
            <h3>DESKTOP</h3>

            <div class="desktop-top">
                <div class="box header">HEADER</div>
                <div class="box menu">MENU</div>
            </div>

            <div class="box hero">HERO</div>

            <div class="desktop-content">
                <div class="box main">MAIN</div>
                <div class="blank"></div>
                <div class="box image">IMAGE</div>
                <div class="box extra">EXTRA</div>
            </div>

            <div class="box banner">BANNER</div>
        </section>

    </div>

</body>
</html>
